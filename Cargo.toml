[package]
name = "random-number-generator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generate random integers in LOKI, with custom ranges and unique draws."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
loki-sdk = "=0.4.0"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
loki-sdk = { version = "=0.4.0", features = ["testing"] }

[package.metadata.loki]
id = "random-number-generator"
name = "Random Number Generator"
health = "/health"
panel = true
assets = ["static"]
capabilities = []

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"

[workspace]
